<!DOCTYPE html>
<html lang="en">
<head>
  <title>Bootstrap Button Groups</title>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  
  <!-- Bootstrap 4 -->
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@4.6.2/dist/css/bootstrap.min.css">

  <style>
    body {
      background-color: #f8f9fa;
      font-family: 'Segoe UI', sans-serif;
    }

    h2 {
      text-align: center;
      margin: 30px 0;
      color: #333;
    }

    .box {
      background: #fff;
      padding: 20px;
      border-radius: 12px;
      box-shadow: 0 4px 10px rgba(0,0,0,0.08);
      margin-bottom: 20px;
      text-align: center;
    }
  </style>
</head>

<body>

<div class="container">

  <h2>Bootstrap Button Groups</h2>

  <!-- Basic Group -->
  <div class="box">
    <h5>Basic Button Group</h5>
    <div class="btn-group">
      <button class="btn btn-primary">Left</button>
      <button class="btn btn-primary">Middle</button>
      <button class="btn btn-primary">Right</button>
    </div>
  </div>

  <!-- Sizes -->
  <div class="box">
    <h5>Button Group Sizes</h5>

    <div class="btn-group btn-group-lg mb-2">
      <button class="btn btn-success">Large</button>
      <button class="btn btn-success">Large</button>
    </div><br>

    <div class="btn-group mb-2">
      <button class="btn btn-success">Normal</button>
      <button class="btn btn-success">Normal</button>
    </div><br>

    <div class="btn-group btn-group-sm">
      <button class="btn btn-success">Small</button>
      <button class="btn btn-success">Small</button>
    </div>
  </div>

  <!-- Vertical -->
  <div class="box">
    <h5>Vertical Button Group</h5>
    <div class="btn-group-vertical">
      <button class="btn btn-info">Top</button>
      <button class="btn btn-info">Middle</button>
      <button class="btn btn-info">Bottom</button>
    </div>
  </div>

  <!-- Toolbar -->
  <div class="box">
    <h5>Button Toolbar</h5>
    <div class="btn-toolbar justify-content-center">
      <div class="btn-group mr-2">
        <button class="btn btn-dark">1</button>
        <button class="btn btn-dark">2</button>
      </div>
      <div class="btn-group">
        <button class="btn btn-secondary">3</button>
        <button class="btn btn-secondary">4</button>
      </div>
    </div>
  </div>

</div>

</body>
</html>
